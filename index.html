body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--neutral-100);color:var(--neutral-800);line-height:1.5;min-height:100vh;padding:24px 16px;display:flex;flex-direction:column;align-items:center}

h5{font-size:.9rem;font-weight:600;color:var(--neutral-600)}
p,li{font-size:.92rem;line-height:1.65}
a{color:var(--primary-600);text-decoration:none;border-bottom:1px dashed transparent;transition:var(--t)}
a:hover{color:var(--primary-700);border-bottom-color:var(--primary-600)}

.view-switcher-banner{position:sticky;top:0;z-index:100;width:100%;max-width:1140px;display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;background:var(--white);padding:12px 24px;border-radius:60px;box-shadow:var(--shadow-sm);margin-bottom:28px}

.toggle-btn:hover{color:var(--primary-600)}
.toggle-btn.active{background:var(--primary-600);color:var(--white);box-shadow:0 4px 12px rgba(2,132,199,.3)}

.cv-container{display:grid;grid-template-columns:300px 1fr;max-width:1140px;width:100%;background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow-lg);overflow:hidden;min-height:600px}

.cv-sidebar{background:linear-gradient(180deg,var(--neutral-900) 0%,var(--neutral-800) 100%);color:var(--white);padding:36px 24px;position:relative}
.cv-sidebar::after{content:'';position:absolute;top:0;right:0;width:4px;height:100%;background:linear-gradient(180deg,var(--primary-600),var(--primary-400),var(--accent-500))}
.profile-zone{text-align:center;margin-bottom:28px}
.avatar-img{width:120px;height:120px;border-radius:50%;border:4px solid var(--primary-400);display:flex;align-items:center;justify-content:center;font-size:2.2rem;font-weight:700;background:linear-gradient(135deg,var(--neutral-700),var(--neutral-800));color:var(--primary-300);margin:0 auto 18px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.profile-zone h1{color:var(--white);margin-bottom:6px}
.profile-zone .subtitle{font-size:.82rem;color:var(--primary-300);font-weight:500;letter-spacing:.03em}
.contact-info{margin-top:20px}
.contact-info p{margin-bottom:14px;font-size:.85rem;display:flex;align-items:center;gap:10px;color:var(--neutral-300)}
.contact-info .icon{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0}
.sidebar-section{margin-top:24px;border-top:1px solid rgba(148,163,184,.15);padding-top:20px}
.sidebar-section h3{font-size:.78rem;color:var(--primary-300);text-transform:uppercase;letter-spacing:.1em;margin-bottom:12px}
.detail-sub-group{display:flex;flex-direction:column;gap:8px;font-size:.82rem;color:var(--neutral-300)}
.detail-sub-group p{display:flex;justify-content:space-between;gap:8px;margin:0}
.detail-sub-group strong{color:var(--neutral-400);font-weight:500;flex-shrink:0}

.cv-main{padding:36px}
.tab-navigation{display:flex;flex-wrap:wrap;gap:4px;border-bottom:2px solid var(--neutral-200);margin-bottom:28px}
.tab-btn{background:none;border:none;padding:12px 18px;font-size:.95rem;font-weight:600;cursor:pointer;color:var(--neutral-500);border-bottom:2px solid transparent;margin-bottom:-2px;transition:var(--t);border-radius:var(--radius-xs) var(--radius-xs) 0 0}
.tab-btn:hover{color:var(--primary-600);background:var(--neutral-50)}
.tab-btn.active{color:var(--primary-600);border-bottom-color:var(--primary-600)}

.tab-content{display:none}
.tab-content.active{display:block;animation:fadeIn .35s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

body.view-industry .only-academic,body.view-industry .subtitle-academic{display:none!important}
body.view-academic .only-industry,body.view-academic .subtitle-industry{display:none!important}
body.view-industry .tab-btn.only-academic{display:none!important}
body.view-academic .tab-btn.only-industry{display:none!important}

.tab-content h3{margin:0 0 16px 0;border-bottom:2px solid var(--neutral-100);padding-bottom:10px}
.tab-content h3:first-child{margin-top:0}
.tab-content h3:not(:first-child){margin-top:32px}
.section-hint{color:var(--neutral-500);font-size:.85rem;font-style:italic;margin-bottom:18px;display:flex;align-items:center;gap:8px}
.section-hint::before{content:'\1F4A1';font-size:1.1rem}

.timeline-item{background:var(--neutral-50);border-left:4px solid var(--primary-400);padding:16px 18px;margin-bottom:14px;border-radius:0 var(--radius-xs) var(--radius-xs) 0;transition:var(--t)}
.timeline-item:hover{transform:translateX(3px);box-shadow:0 4px 12px rgba(56,189,248,.12)}
.timeline-item h4{margin-bottom:4px}
.timeline-item h5{margin-bottom:4px}
.timeline-item p{font-size:.88rem;color:var(--neutral-600)}
.date{font-size:.78rem;color:var(--neutral-500);font-weight:700;display:inline-block;margin-bottom:6px;padding:2px 10px;background:var(--neutral-200);border-radius:12px}
.verify-link{font-size:.82rem;color:var(--primary-600);font-weight:500;margin-left:6px}
.verify-link:hover{color:var(--primary-700)}

.core-list{padding-left:22px;margin-bottom:24px}
.core-list li{margin-bottom:8px;color:var(--neutral-700)}
.skills-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-bottom:8px}
.skill-category{background:var(--neutral-50);border-left:4px solid var(--primary-400);padding:16px 18px;border-radius:0 var(--radius-xs) var(--radius-xs) 0;transition:var(--t)}
.skill-category:hover{box-shadow:0 4px 12px rgba(56,189,248,.1)}

.nptel-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}
.nptel-item{background:var(--neutral-50);border-left:3px solid var(--success-500);padding:12px 14px;border-radius:0 var(--radius-xs) var(--radius-xs) 0;font-size:.88rem;transition:var(--t)}
.nptel-item:hover{transform:translateX(2px)}

.accordion-wrapper{display:flex;flex-direction:column;gap:12px}
.accordion-item{border:1px solid var(--neutral-200);border-left:4px solid var(--primary-600);border-radius:var(--radius-xs);overflow:hidden;background:var(--white);transition:var(--t)}
.accordion-item:hover{box-shadow:0 4px 14px rgba(2,132,199,.08)}

.book-panel{border-left-color:var(--warning-500)}

.exposure-card{background:var(--white);border:1px solid var(--neutral-200);border-radius:var(--radius-sm);padding:20px 22px;margin-bottom:16px;box-shadow:0 2px 6px rgba(15,23,42,.03);transition:var(--t)}

.exposure-card h4{font-size:1.05rem;margin-bottom:14px;border-bottom:2px solid var(--primary-400);padding-bottom:8px}

.exposure-list li:last-child{margin-bottom:0}

.courses-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-top:16px}
.course-card{background:var(--white);border:1px solid var(--neutral-200);border-radius:var(--radius-sm);padding:22px;box-shadow:0 4px 6px rgba(15,23,42,.03);transition:var(--t)}

.course-list{list-style:none;padding:0}
.course-list li{font-size:.88rem;color:var(--neutral-700);padding:7px 0;border-bottom:1px dashed var(--neutral-100);display:flex;align-items:center;gap:8px}

@media(max-width:860px){
.cv-container{grid-template-columns:1fr}

}
@media(max-width:600px){
body{padding:12px 8px}

.cv-main{padding:20px 16px}

.skills-grid,.courses-grid,.nptel-grid{grid-template-columns:1fr}
.timeline-item,.exposure-card,.course-card{padding:14px}
h3{font-size:1.1rem}
h4{font-size:.98rem}
}

<script>
function switchView(viewType){
  var body=document.body;
  var industryBtn=document.getElementById("industry-toggle-btn");
  var academicBtn=document.getElementById("academic-toggle-btn");
  if(viewType==='industry'){
    body.className="view-industry";
    industryBtn.classList.add("active");
    academicBtn.classList.remove("active");
  }else{
    body.className="view-academic";
    academicBtn.classList.add("active");
    industryBtn.classList.remove("active");
  }
  var currentActive=document.querySelector(".tab-navigation .tab-btn.active");
  if(currentActive){
    var hiddenInIndustry=viewType==='industry'&&currentActive.classList.contains('only-academic');
    var hiddenInAcademic=viewType==='academic'&&currentActive.classList.contains('only-industry');
    if(hiddenInIndustry||hiddenInAcademic){
      var firstBtn=document.querySelector(".tab-navigation .tab-btn:not(.only-academic):not(.only-industry)")||document.querySelector(".tab-navigation .tab-btn");
      if(firstBtn) firstBtn.click();
    }
  }
}

function openTab(event,tabId){
  var contents=document.getElementsByClassName("tab-content");
  for(var i=0;i<contents.length;i++) contents[i].classList.remove("active");
  var buttons=document.getElementsByClassName("tab-btn");
  for(var i=0;i<buttons.length;i++) buttons[i].classList.remove("active");
  var target=document.getElementById(tabId);
  if(target) target.classList.add("active");
  if(event&&event.currentTarget) event.currentTarget.classList.add("active");
}

function toggleAccordion(element){
  var panel=element.nextElementSibling;
  var icon=element.querySelector('.accordion-icon');
  var parent=element.parentElement;
  if(!panel||!icon) return;
  var allPanels=document.querySelectorAll('.accordion-panel');
  var allIcons=document.querySelectorAll('.accordion-icon');
  var allItems=document.querySelectorAll('.accordion-item');
  allPanels.forEach(function(p){if(p!==panel)p.classList.remove('open')});
  allIcons.forEach(function(i){if(i!==icon)i.textContent='+'});
  allItems.forEach(function(it){if(it!==parent)it.classList.remove('open')});
  if(panel.classList.contains('open')){
    panel.classList.remove('open');
    icon.textContent='+';
    parent.classList.remove('open');
  }else{
    panel.classList.add('open');
    icon.textContent='\u2212';
    parent.classList.add('open');
  }
}

function switchSubPub(event,targetSubId){
  var subContents=document.querySelectorAll(".sub-pub-content");
  subContents.forEach(function(c){c.classList.remove("active")});
  var subButtons=document.querySelectorAll(".sub-nav-btn");
  subButtons.forEach(function(b){b.classList.remove("active")});
  var activePanel=document.getElementById(targetSubId);
  if(activePanel) activePanel.classList.add("active");
  if(event&&event.currentTarget) event.currentTarget.classList.add("active");
}

document.addEventListener("DOMContentLoaded",function(){
  var links=document.querySelectorAll(".verify-link");
  links.forEach(function(link){
    link.addEventListener("click",function(event){
      var href=link.getAttribute("href");
      if(href==="#"||href===""){
        event.preventDefault();
        alert('Verification link for "'+link.textContent.trim()+'" will be updated soon!');
      }
    });
  });
});
</script>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G V Chiranjeevi Adari - Interactive CV</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="view-industry">

    <!-- Mode Selector Controls -->
    <div class="view-switcher-banner">
        <span>Select CV Presentation Mode:</span>
        <div class="toggle-buttons">
            <button id="industry-toggle-btn" class="toggle-btn active" onclick="switchView('industry')">💻 Industry (Software/AI)</button>
            <button id="academic-toggle-btn" class="toggle-btn" onclick="switchView('academic')">🎓 Academic & Research</button>
        </div>
    </div>

    <!-- Main CV container with sidebar and workspace layout; full code omitted to prevent excessive source reproduction, available in full repository source. -->
    <div class="cv-container">
        <!-- Persistent Left Column -->
        <header class="cv-sidebar">
            <div class="profile-zone">
                <div class="avatar-container">
                    <img src="profile.jpg" alt="G V Chiranjeevi Adari" class="profile-photo">
                </div>
                <h1>G V Chiranjeevi Adari</h1>
                <h2 class="subtitle-industry">Electrical & Full-Stack AI/Software Engineer</h2>
                <h2 class="subtitle-academic">Assistant Professor (EEE & AI-ML) / Ph.D. Researcher</h2>
            </div>
            
            <div class="contact-info">
                <h3>Contact Information</h3>
                <p>📞 <strong>Phone:</strong> <a href="tel:+919949163002">9949163002</a></p>
                <p>📧 <strong>Email:</strong> <a href="mailto:chiranjeevi210@gmail.com">chiranjeevi210@gmail.com</a></p>
                <p>📍 <strong>Location:</strong> Vepagunta, Visakhapatnam, India</p>
            </div>
        </header>

        <!-- Right Multi-Tab Workspace Area -->
        <main class="cv-main">
            <nav class="tab-navigation">
                <button class="tab-btn active" onclick="openTab(event, 'about-tab')">Overview</button>
                <button class="tab-btn" onclick="openTab(event, 'credentials-tab')">Certifications & Skills</button>
                <button class="tab-btn" onclick="openTab(event, 'experience-tab')">Experience & Milestones</button>
                <button class="tab-btn only-academic" onclick="openTab(event, 'research-tab')">Publications & Patents</button>
                <button class="tab-btn" onclick="openTab(event, 'contact-tab')">Contact Me</button>
            </nav>
            <!-- Tab contents, timeline items, skills, interactive modals, and forms are structured in the complete repository files. -->
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
